name: somobay_somiti_mobile_app
description: "A production-grade Flutter mobile application for Somobay Somiti (Cooperative Society) management."
publish_to: 'none'

version: 1.0.2+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.1.0
  intl: ^0.19.0
  json_annotation: ^4.9.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  package_info_plus: ^8.1.0
  url_launcher: ^6.3.0
  uuid: ^4.5.1
  file_picker: ^11.0.3
  image: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  # Only the in-app logo; the launcher/Play Store artwork is not bundled.
  assets:
    - assets/images/logo.jpg

  # assets:
  #   - assets/icons/
  #   - assets/images/
